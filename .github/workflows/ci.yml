name: Phase 1 CI

# Every push and pull request runs the same gate as `pnpm run verify:phase-01`
# locally. Least privilege: no deployment or write credentials in Phase 1, and
# no untrusted privileged event (no pull_request_target, no workflow_run).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret, deterministic placeholders. No real Clerk credential is present
  # in CI; real credentials are only needed for the manual Phase 5 journeys.
  NODE_ENV: test
  CLERK_SECRET_KEY: sk_test_ci_placeholder
  CLERK_JWT_KEY: jwt_test_ci_placeholder
  CLERK_WEB_ORIGIN: http://localhost:3000
  ADMIN_EMAILS: owner@example.test
  TOMBSTONE_SECRET: ci_tombstone_secret_placeholder
  DATABASE_URL: postgresql://ecom_ci:ecom_ci_local@127.0.0.1:5432/ecom_ci_test
  DIRECT_URL: postgresql://ecom_ci:ecom_ci_local@127.0.0.1:5432/ecom_ci_test

jobs:
  phase-01-gate:
    name: Phase 1 gate (lint, typecheck, build, migrate, test, Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # PostgreSQL 17 with an explicit health check and isolated CI credentials.
      # The gate's migration step deploys to a fresh disposable database so no
      # developer or shared database is ever reused.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecom_ci
          POSTGRES_PASSWORD: ecom_ci_local
          POSTGRES_DB: ecom_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom_ci -d ecom_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout (actions/checkout v4.2.2, pinned immutable ref)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js from .nvmrc (actions/setup-node v4.4.0, pinned immutable ref)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Provision the exact pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          test "$(pnpm --version)" = "11.5.2"

      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Run the Phase 1 gate (identical to local `pnpm run verify:phase-01`)
        run: pnpm run verify:phase-01

      - name: Compose build check (local config only — no cloud deploy)
        run: |
          docker compose config --quiet
          docker compose build api
