name: ecom-v1

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom_local_dev
      POSTGRES_DB: ecom_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ecom:ecom_local_dev@postgres:5432/ecom_dev
      DIRECT_URL: postgresql://ecom:ecom_local_dev@postgres:5432/ecom_dev
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_local_placeholder}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-local_dev_jwt_key_placeholder}
      CLERK_WEB_ORIGIN: ${CLERK_WEB_ORIGIN:-http://localhost:3000}
      CLERK_ISSUER: ${CLERK_ISSUER:-https://clerk.example.test}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-clerk.example.test}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-owner@example.test}
      TOMBSTONE_SECRET: ${TOMBSTONE_SECRET:-local_dev_tombstone_secret_change_me}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Container health uses liveness (no DB dependency); readiness stays a
    # truthful, independently probeable reflection of PostgreSQL state.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
